<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
    <form id="userForm">
        <div class="row mb-6">
            <label>Name : </label>
            <input type="text" id="name" placeholder="Enter Name"></input>
        </div>
        <div>
            <label>Gender : </label>
            <select id="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>
        <div>
            <label>Mobile Number : </label>
            <input type="number" id="mobile" placeholder="Enter Mobile Number"></input>
        </div>
        <div>
            <label>Qualification : </label>
            <input type="text" id="qualification" placeholder="Enter Address"></input>
        </div>
        <div>
            <label>Address : </label>
            <input type="text" id="address" placeholder="Enter Address"></input>
        </div>
        </div>
        <div>
            <label>Status : </label>
            <input type="checkbox" id="status" placeholder="Choose Status"></input>
        </div>
        <div>
            <button type="button" id="savebtn">Save</button>
        </div>
        <br>

        <table id="dataTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Mobile Number</th>
                    <th>Qualification</th>
                    <th>Address</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <!-- Fill via JQUERY -->
            </tbody>
        </table>


        <script>
            $(document).ready(function () {
                $('#savebtn').click(function () {
                    const name = $('#name').val().trim();
                    const gender = $('#gender').val();
                    const mobile = $('#mobile').val().trim();
                    const qualification = $('#qualification').val().trim();
                    const address = $('#address').val().trim();
                    const isActive = $('#status').prop('checked');

                    if (name === '') return alert('Please enter Name!');
                    if (gender === '') return alert('Please select Gender!');

                    const pattern = /^[6-9]\d{9}$/;
                    if (!pattern.test(mobile)) return alert('Please enter a validnumber!');
                    if (qualification === '') return alert('Please enter Qualification!');
                    if (address === '') return alert('Please enter Address!');

                    const status = isActive ? 'Active' : 'Not Active';

                    const newRow = `
                    <tr>
                        <td>${name}</td>
                        <td>${gender}</td>
                        <td>${mobile}</td>
                        <td>${qualification}</td>
                        <td>${address}</td>
                        <td>${status}</td>                        
                        <td><button class="delete-btn">Delete</button></td>
                    </tr>
                `;

                    $('#dataTable tbody').append(newRow);
                    $('#userForm')[0].reset();
                });

                $(document).on('click', '.delete-btn', function () {
                    $(this).closest('tr').remove();
                });
            });
        </script>
    </form>
</body>
</html>
