<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-group label {
            margin-bottom: 0;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-container {
            text-align: center;
            margin: 30px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background-color: #f8f9ff;
            transform: scale(1.01);
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        .delete-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 8px 20px;
            font-size: 0.9em;
            box-shadow: 0 4px 10px rgba(245, 87, 108, 0.3);
        }

        .delete-btn:hover {
            box-shadow: 0 6px 15px rgba(245, 87, 108, 0.5);
        }

        .status-active {
            color: #4caf50;
            font-weight: 600;
        }

        .status-inactive {
            color: #f44336;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            table {
                font-size: 0.85em;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📝 User Registration</h1>
        <form id="userForm">
            <div class="form-group">
                <label for="name">👤 Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>
            
            <div class="form-group">
                <label for="gender">⚧ Gender</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="mobile">📱 Mobile Number</label>
                <input type="number" id="mobile" placeholder="Enter 10-digit mobile number">
            </div>
            
            <div class="form-group">
                <label for="qualification">🎓 Qualification</label>
                <input type="text" id="qualification" placeholder="Enter your qualification">
            </div>
            
            <div class="form-group">
                <label for="address">🏠 Address</label>
                <input type="text" id="address" placeholder="Enter your address">
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="status">
                <label for="status">✅ Active Status</label>
            </div>
            
            <div class="btn-container">
                <button type="button" id="savebtn">💾 Save Record</button>
            </div>

        <table id="dataTable">
            <thead>
                <tr>
                    <th>👤 Name</th>
                    <th>⚧ Gender</th>
                    <th>📱 Mobile</th>
                    <th>🎓 Qualification</th>
                    <th>🏠 Address</th>
                    <th>✓ Status</th>
                    <th>⚙️ Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be added dynamically via jQuery -->
            </tbody>
        </table>

        <script>
            $(document).ready(function () {
                $('#savebtn').click(function () {
                    const name = $('#name').val().trim();
                    const gender = $('#gender').val();
                    const mobile = $('#mobile').val().trim();
                    const qualification = $('#qualification').val().trim();
                    const address = $('#address').val().trim();
                    const isActive = $('#status').prop('checked');

                    if (name === '') return alert('Please enter Name!');
                    if (gender === '') return alert('Please select Gender!');

                    const pattern = /^[6-9]\d{9}$/;
                    if (!pattern.test(mobile)) return alert('Please enter a valid mobile number!');
                    if (qualification === '') return alert('Please enter Qualification!');
                    if (address === '') return alert('Please enter Address!');

                    const status = isActive ? 'Active' : 'Not Active';
                    const statusClass = isActive ? 'status-active' : 'status-inactive';

                    const newRow = `
                    <tr>
                        <td>${name}</td>
                        <td>${gender}</td>
                        <td>${mobile}</td>
                        <td>${qualification}</td>
                        <td>${address}</td>
                        <td class="${statusClass}">${status}</td>                        
                        <td><button class="delete-btn">🗑️ Delete</button></td>
                    </tr>
                `;

                    $('#dataTable tbody').append(newRow);
                    $('#userForm')[0].reset();
                });

                $(document).on('click', '.delete-btn', function () {
                    $(this).closest('tr').remove();
                });
            });
        </script>
    </form>
    </div>
</body>
</html>
